[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tsm-simulation"
version = "0.1.0"
description = "Modular simulations for two-sided online stochastic matching algorithms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "networkx>=3.1",
    "scipy>=1.10",
    "tqdm>=4.65",
]

[project.scripts]
tsm-sim = "simulations.__main__:main"

[tool.setuptools.packages.find]
include = ["arrival_algorithms*", "graph_algorithms*", "matching_algorithms*", "simulations*"]
